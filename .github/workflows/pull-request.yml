name: Pull Request

on:
  pull_request:
    paths-ignore:
      - ".github/ISSUE_TEMPLATE/*"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "README.md"
      - "docs/**"
  # Weekly run on main catches toolchain/runner-image rot between PRs.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to no token scopes at all; every job that needs one declares it below.
permissions: {}

jobs:
  validate_gradle_wrapper:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # No job here pushes or otherwise re-uses the checkout credential, so keep it
          # out of .git/config where it would be picked up by artifact uploads.
          persist-credentials: false
      - name: Release tooling tests
        timeout-minutes: 1
        run: ./scripts/tests/run-tests.sh
      - name: Gradle Wrapper Validation
        timeout-minutes: 1
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

  check_properties:
    needs: validate_gradle_wrapper
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # No job here pushes or otherwise re-uses the checkout credential, so keep it
          # out of .git/config where it would be picked up by artifact uploads.
          persist-credentials: false
      - name: Setup
        id: setup
        timeout-minutes: 10
        uses: ./.github/actions/setup
      - name: Check properties
        timeout-minutes: 4
        run: |
          make check-properties

  static_analysis_shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # No job here pushes or otherwise re-uses the checkout credential, so keep it
          # out of .git/config where it would be picked up by artifact uploads.
          persist-credentials: false
      - name: Shellcheck
        timeout-minutes: 1
        run: |
          find . -name "*.sh" -not -path "./.git/*" \
            -not -path "./build/*" -not -path "./.gradle/*" \
            -print -exec shellcheck {} +

  static_analysis_detekt:
    needs: validate_gradle_wrapper
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # No job here pushes or otherwise re-uses the checkout credential, so keep it
          # out of .git/config where it would be picked up by artifact uploads.
          persist-credentials: false
      - name: Setup
        id: setup
        timeout-minutes: 30
        uses: ./.github/actions/setup
      - name: Detekt
        timeout-minutes: 4
        run: |
          make detekt
      - name: Collect Artifacts
        timeout-minutes: 1
        if: ${{ always() }}
        env:
          ARTIFACTS_DIR_PATH: ${{ format('{0}/artifacts', env.home) }}
          REPORTS_ZIP_PATH: ${{ format('{0}/artifacts/static_analysis_detekt.zip', env.home) }}
        run: |
          mkdir ${ARTIFACTS_DIR_PATH}

          zip -r ${REPORTS_ZIP_PATH} . -i build/reports/detekt/\*
      - name: Upload Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: 1
        with:
          name: Detekt static analysis results
          path: ~/artifacts

  static_analysis_ktlint:
    needs: validate_gradle_wrapper
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # No job here pushes or otherwise re-uses the checkout credential, so keep it
          # out of .git/config where it would be picked up by artifact uploads.
          persist-credentials: false
      - name: Setup
        id: setup
        timeout-minutes: 30
        uses: ./.github/actions/setup
      - name: Ktlint
        timeout-minutes: 4
        run: |
          make ktlint
      - name: Collect Artifacts
        timeout-minutes: 1
        if: ${{ always() }}
        env:
          ARTIFACTS_DIR_PATH: ${{ format('{0}/artifacts', env.home) }}
          REPORTS_ZIP_PATH: ${{ format('{0}/artifacts/static_analysis_ktlint.zip', env.home) }}
        run: |
          mkdir ${ARTIFACTS_DIR_PATH}

          zip -r ${REPORTS_ZIP_PATH} . -i build/reports/ktlint/\*
      - name: Upload Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: 1
        with:
          name: Ktlint static analysis results
          path: ~/artifacts

  static_analysis_android_lint:
    needs: validate_gradle_wrapper
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # No job here pushes or otherwise re-uses the checkout credential, so keep it
          # out of .git/config where it would be picked up by artifact uploads.
          persist-credentials: false
      - name: Setup
        id: setup
        timeout-minutes: 30
        uses: ./.github/actions/setup
        with:
          rust-cache: true
      - name: Android Lint
        timeout-minutes: 45
        env:
          # Disable minify, since it makes lint run faster
          ORG_GRADLE_PROJECT_IS_MINIFY_APP_ENABLED: false
        run: |
          make lint-android
      - name: Collect Artifacts
        if: ${{ always() }}
        timeout-minutes: 1
        env:
          ARTIFACTS_DIR_PATH: ${{ format('{0}/artifacts', env.home) }}
          LINT_ZIP_PATH: ${{ format('{0}/artifacts/android_lint.zip', env.home) }}
        run: |
          mkdir ${ARTIFACTS_DIR_PATH}
          zip -r ${LINT_ZIP_PATH} . -i \*build/reports/\*
      - name: Upload Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: 1
        with:
          name: Android Lint static analysis results
          path: ~/artifacts

  # Runs the Rust unit tests. static_analysis_clippy compiles them via --tests but never
  # executes them, so without this a failing test can sit unnoticed indefinitely.
  test_rust_unit:
    needs: validate_gradle_wrapper
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # No job here pushes or otherwise re-uses the checkout credential, so keep it
          # out of .git/config where it would be picked up by artifact uploads.
          persist-credentials: false
      - name: Setup
        id: setup
        timeout-minutes: 30
        uses: ./.github/actions/setup
        with:
          rust-cache: true
      - name: Test
        timeout-minutes: 15
        run: |
          make test-rust

  # The feature list matters: code behind a cargo feature (for example the
  # android-test-fixtures gate the Android build enables) is invisible to a
  # default-feature check, so a merge can break it while `cargo check` stays green.
  # make lint-rust enables every feature except `voting` (RUST_CHECK_FEATURES in
  # the Makefile), which does not build until zcash_voting is ported.
  # --tests extends the same coverage to test-only code.
  static_analysis_clippy:
    needs: validate_gradle_wrapper
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # No job here pushes or otherwise re-uses the checkout credential, so keep it
          # out of .git/config where it would be picked up by artifact uploads.
          persist-credentials: false
      - name: Setup
        id: setup
        timeout-minutes: 30
        uses: ./.github/actions/setup
        with:
          rust-cache: true
      - name: Clippy
        timeout-minutes: 15
        run: |
          make lint-rust

  # Checks that the Rust sources are rustfmt-clean. `--check` only reports; it never
  # rewrites the tree, so this job cannot mask an unformatted commit by fixing it.
  #
  # There is no rustfmt.toml, so this is stock rustfmt defaults for the edition in
  # backend-lib/Cargo.toml. Run `cargo fmt --all` in backend-lib/ to fix a failure.
  static_analysis_rustfmt:
    needs: validate_gradle_wrapper
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # No job here pushes or otherwise re-uses the checkout credential, so keep it
          # out of .git/config where it would be picked up by artifact uploads.
          persist-credentials: false
      - name: Setup
        id: setup
        timeout-minutes: 30
        uses: ./.github/actions/setup
      - name: Rustfmt
        timeout-minutes: 5
        run: |
          make check-format-rust

  # backend-lib/src/main/proto/proposal.proto is vendored from librustzcash.
  # Rust encodes proposals with the schema of the pinned zcash_client_backend,
  # so a stale copy silently drops fields on the Kotlin side. Re-derive it from
  # the pinned version and fail if the committed copy differs.
  check_proposal_proto:
    needs: validate_gradle_wrapper
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The check only reads Cargo.lock and curls a public URL, so it needs no
          # credential; keep it out of .git/config.
          persist-credentials: false
      - name: Check proposal.proto matches the pinned zcash_client_backend
        timeout-minutes: 5
        run: |
          ./scripts/update-proposal-proto.sh --check

  # Licence gate for the native library: every crate in backend-lib's dependency graph must
  # carry a licence from the permissive-only allow-list in backend-lib/deny.toml, and every git
  # source must be one that file names. cargo-deny only resolves the lockfile (`cargo metadata`),
  # so the job installs a pinned, checksummed release binary and lets rustup pick the toolchain
  # from rust-toolchain.toml; it needs neither the Gradle caches nor an Android build.
  check_native_licenses:
    needs: validate_gradle_wrapper
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # No job here pushes or otherwise re-uses the checkout credential, so keep it
          # out of .git/config where it would be picked up by artifact uploads.
          persist-credentials: false
      - name: Install cargo-deny
        timeout-minutes: 3
        env:
          CARGO_DENY_VERSION: "0.20.2"
          CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
        run: |
          set -euo pipefail
          archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "${archive}.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${archive}.tar.gz"
          echo "${CARGO_DENY_SHA256}  ${archive}.tar.gz" | sha256sum --check --strict
          tar -xzf "${archive}.tar.gz" "${archive}/cargo-deny"
          install -m 0755 "${archive}/cargo-deny" "${HOME}/.cargo/bin/cargo-deny"
          rm -rf "${archive}" "${archive}.tar.gz"
          cargo deny --version
      - name: cargo deny
        timeout-minutes: 15
        run: |
          make deny-rust

  test_android_modules_unit:
    needs: [validate_gradle_wrapper]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # No job here pushes or otherwise re-uses the checkout credential, so keep it
          # out of .git/config where it would be picked up by artifact uploads.
          persist-credentials: false
      - name: Setup
        id: setup
        timeout-minutes: 30
        uses: ./.github/actions/setup
        with:
          rust-cache: true
      # 60 rather than the usual 30: this branch re-enables shielded voting, which
      # turns on orchard's `unstable-voting-circuits` and pulls the halo2 voting
      # circuits into the native build. `make test-unit` builds the crate for all
      # four ABIs, so that lands four times over. The step also cannot start warm:
      # the Rust cache key hashes backend-lib/Cargo.toml and build.gradle.kts, both
      # modified here, and the prefix-matched fallback cache was built without
      # `--cfg zcash_voting`, so every crate rebuilds. Measured at 30m+ against
      # ~28m for the same job on a voting-disabled branch.
      - name: Build and test
        timeout-minutes: 60
        run: |
          make test-unit
      - name: Collect Artifacts
        if: ${{ always() }}
        timeout-minutes: 1
        env:
          ARTIFACTS_DIR_PATH: ${{ format('{0}/artifacts', env.home) }}
          TEST_RESULTS_ZIP_PATH: ${{ format('{0}/artifacts/test_results.zip', env.home) }}
        run: |
          mkdir ${ARTIFACTS_DIR_PATH}

          zip -r ${TEST_RESULTS_ZIP_PATH} . -i \*/build/test-results/\* \*/build/reports/\*
      - name: Upload Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: 1
        with:
          name: Test Android modules with Unit Tests
          path: ~/artifacts

  # Runs the Android instrumentation suites on a Gradle Managed Device: a
  # hardware-accelerated emulator booted inside the runner. This replaces the
  # former emulator.wtf cloud job and depends on no external test service.
  test_android_modules_emulator:
    needs: [validate_gradle_wrapper]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # No job here pushes or otherwise re-uses the checkout credential, so keep it
          # out of .git/config where it would be picked up by artifact uploads.
          persist-credentials: false
      # ubuntu-latest exposes /dev/kvm, but the default udev rules do not grant
      # the runner user access to it. This rule opens it so the managed-device
      # emulator can use KVM acceleration instead of falling back to software.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Setup
        id: setup
        timeout-minutes: 30
        uses: ./.github/actions/setup
        with:
          rust-cache: true
      # The hosted runner's Android SDK does not include the emulator package,
      # which a Gradle Managed Device requires. AGP auto-installs the system
      # image but not the emulator, so without this the pixel2MinSetup task
      # fails at VersionedSdkLoader.getEmulatorDirectoryProvider().get() with
      # "Cannot query the value of this property because it has no value
      # available". Install it explicitly.
      - name: Install Android emulator
        timeout-minutes: 5
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "emulator"
      # pixel2Min is the Gradle Managed Device defined in
      # zcash-sdk.android-conventions.gradle.kts (Pixel 2, API ANDROID_MIN_SDK_VERSION).
      # Scoped to the same four modules the former emulator.wtf job covered;
      # the unqualified task would also pull in darkside-test-lib (needs a live
      # darkside server) and the demo-app modules. maxConcurrentDevices=1 keeps a
      # single emulator booted at a time so the runner is not overwhelmed by four
      # parallel emulators; in-runner emulators run serially, hence the higher
      # timeout than the former cloud job.
      # emulator.gpu=swiftshader_indirect forces software rendering. The hosted
      # runner is headless, and AGP's default '-gpu auto-no-window' intermittently
      # falls back to 'auto', which needs a real GPU and fails to boot the
      # emulator (EmulatorStartFailedException during snapshot creation).
      - name: Build and test
        timeout-minutes: 45
        run: |
          make test-instrumented
      - name: Collect Artifacts
        if: ${{ always() }}
        timeout-minutes: 1
        env:
          ARTIFACTS_DIR_PATH: ${{ format('{0}/artifacts', env.home) }}
          TEST_RESULTS_ZIP_PATH: ${{ format('{0}/artifacts/test_results.zip', env.home) }}
        run: |
          mkdir ${ARTIFACTS_DIR_PATH}

          # Managed-device runs write results/reports under build/outputs and
          # build/reports/androidTests, not build/test-results, so include those
          # too to make failures inspectable from the artifact.
          zip -r ${TEST_RESULTS_ZIP_PATH} . \
            -i \*/build/test-results/\* \
            \*/build/outputs/androidTest-results/\* \
            \*/build/reports/androidTests/\*
      - name: Upload Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: 1
        with:
          name: Test Android modules with emulator results
          path: ~/artifacts

  demo_app_release_build:
    needs: validate_gradle_wrapper
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # No job here pushes or otherwise re-uses the checkout credential, so keep it
          # out of .git/config where it would be picked up by artifact uploads.
          persist-credentials: false
      - name: Setup
        id: setup
        timeout-minutes: 30
        uses: ./.github/actions/setup
        with:
          rust-cache: true
      # A fake signing key to satisfy creating a "release" build
      - name: Export Signing Key
        env:
          SIGNING_KEY_PATH: ${{ format('{0}/release.jks', env.home) }}
        shell: bash
        run: |
          keytool -genkey -v -keystore $SIGNING_KEY_PATH -keypass android -storepass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 100000 -dname "CN=, OU=, O=Test, L=, S=, C=" -noprompt
      - name: Build
        timeout-minutes: 45
        env:
          ORG_GRADLE_PROJECT_ZCASH_RELEASE_KEYSTORE_PATH: ${{ format('{0}/release.jks', env.home) }}
          ORG_GRADLE_PROJECT_ZCASH_RELEASE_KEYSTORE_PASSWORD: android
          ORG_GRADLE_PROJECT_ZCASH_RELEASE_KEY_ALIAS: androiddebugkey
          ORG_GRADLE_PROJECT_ZCASH_RELEASE_KEY_ALIAS_PASSWORD: android
        run: |
          make build-release
      - name: Collect Artifacts
        timeout-minutes: 1
        env:
          ARTIFACTS_DIR_PATH: ${{ format('{0}/artifacts', env.home) }}
          BINARIES_ZIP_PATH: ${{ format('{0}/artifacts/binaries.zip', env.home) }}
          MAPPINGS_ZIP_PATH: ${{ format('{0}/artifacts/mappings.zip', env.home) }}
        run: |
          mkdir ${ARTIFACTS_DIR_PATH}
          zip -r ${BINARIES_ZIP_PATH} . -i demo-app/build/outputs/apk/\*/release/\*.apk demo-app/build/outputs/bundle/\*/release/\*.aab
          zip -r ${MAPPINGS_ZIP_PATH} . -i demo-app/build/outputs/mapping/\*/mapping.txt
      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: 1
        with:
          name: Demo app release binaries
          path: ~/artifacts
